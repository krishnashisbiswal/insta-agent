name: Daily Autonomous Instagram Reel Publisher

on:
  schedule:
    # 03:00 UTC = 08:30 IST (Morning Devotion - Pre-generates at 08:30, ready for 09:00 peak)
    - cron: '0 3 * * *'
    # 07:00 UTC = 12:30 IST (Lunch Break - Pre-generates at 12:30, ready for 13:00 peak)
    - cron: '0 7 * * *'
    # 13:00 UTC = 18:30 IST (Prime Evening Surge - Pre-generates at 18:30, ready for 19:15 golden peak)
    - cron: '0 13 * * *'
    # 16:00 UTC = 21:30 IST (Late Night Relax - Pre-generates at 21:30, ready for 22:00 peak)
    - cron: '0 16 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force publish today (bypasses daily frequency limiter & timing gate)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Verify FFmpeg and Fonts
        run: |
          sudo apt-get update -o Acquire::http::Timeout="10" -o Acquire::Retries="2" || true
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-core fonts-deva || true
          ffmpeg -version | head -n 1

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Daily Algorithm Publisher
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INSTAGRAM_USERNAME: ${{ secrets.INSTAGRAM_USERNAME }}
          INSTAGRAM_PASSWORD: ${{ secrets.INSTAGRAM_PASSWORD }}
          INSTAGRAM_SESSION_ID: ${{ secrets.INSTAGRAM_SESSION_ID }}
          INSTAGRAM_SESSION_DATA: ${{ secrets.INSTAGRAM_SESSION_DATA }}
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
          SARVAM_SPEAKER: "arjun"
          SARVAM_MODEL: "bulbul:v4-flash"
          SARVAM_PACE: "1.00"
          VOICE_ENGINE: "sarvam"
          VOICE_MODE: "smart"
          VOICE_GENDER: "male"
          BRAND_WATERMARK: "@neodivinestore.in"
          TIMEZONE: "Asia/Kolkata"
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            echo "⚡ Manual forced publication requested by operator."
            python app/autonomous/daily_algorithm_publisher.py --force
          else
            echo "🤖 Autonomous algorithmic run - Agent Brain evaluating optimal window & daily limit."
            python app/autonomous/daily_algorithm_publisher.py
          fi

      - name: Commit Tracking History & State
        if: success()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f storage/daily_post_tracker.json storage/trend_history.json storage/algorithm_intelligence.json 2>/dev/null || true
          git commit -m "chore(autonomous): sync post tracker & trend history [skip ci]" || echo "No tracking changes to commit"
          git push || echo "Push skipped or not needed"

      - name: Save Generated Reel Package as Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-reel-output-${{ github.run_id }}
          path: |
            insta content/
            storage/
          if-no-files-found: ignore
          retention-days: 7
