name: CI Test Suite and Integrity Verification

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege permissions: read-only access to repository contents
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
      fail-fast: false

    env:
      PYTHONPATH: "."
      TESTING: "true"
      AUTO_PUBLISH: "false"
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install System Fonts & FFmpeg
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -qq -o Acquire::http::Timeout="15" -o Acquire::Retries="3"
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ffmpeg fonts-noto-core fonts-deva

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Validate Python Syntax
        run: |
          python -m compileall -q app/ config/ tests/

      - name: Verify Key Imports
        run: |
          python -c "import app.autonomous.daily_algorithm_publisher; import app.video.dynamic_visual_engine; import app.api.main; import app.storage.permanent_visual_memory; import app.utils.ffmpeg_resolver; print('All key imports succeeded.')"

      - name: Run Startup Preflight Validation (Dry-Run)
        env:
          AUTO_PUBLISH: "false"
        run: |
          python app/autonomous/daily_algorithm_publisher.py --validate --dry-run

      - name: Run Complete Test Suite
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AUTO_PUBLISH: "false"
          PYTHONPATH: "."
          TESTING: "true"
        run: |
          pytest -v
