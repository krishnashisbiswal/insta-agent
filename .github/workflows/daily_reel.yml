name: Daily Autonomous Instagram Reel Publisher

on:
  # SCHEDULE DISABLED: Prevents GitHub Actions from automatically generating and publishing
  # low-quality videos or unintended posts to Instagram.
  # To trigger manually, use the 'Run workflow' button in GitHub Actions.
  # schedule:
  #   - cron: '15 3 * * *'
  #   - cron: '15 5 * * *'
  #   - cron: '15 7 * * *'
  #   - cron: '15 13 * * *'
  #   - cron: '15 16 * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish live to Instagram (set true to post live, defaults to false dry-run)'
        required: false
        default: false
        type: boolean
      force:
        description: 'Force publish today (bypasses daily frequency limiter & timing gate)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      category:
        description: 'Optional content category override (e.g. healing_crystals, sacred_rudraksha)'
        required: false
        default: ''
        type: string

# Single-execution lock: prevents duplicate simultaneous publishing workflows
concurrency:
  group: daily-publishing
  cancel-in-progress: false

# Least-privilege permissions: read access to contents and actions artifacts
permissions:
  contents: read
  actions: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Verify FFmpeg and Fonts
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -qq -o Acquire::http::Timeout="15" -o Acquire::Retries="3"
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ffmpeg fonts-noto-core fonts-deva fonts-noto-extra
          ffmpeg -version | head -n 1

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Restore Persistent State Cache
        id: restore-state-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            storage/
          key: insta-agent-state-${{ github.run_id }}
          restore-keys: |
            insta-agent-state-

      - name: Fallback Restore State from Previous Artifact (if cache miss)
        if: steps.restore-state-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "State cache miss. Checking for previous successful workflow artifact..."
          mkdir -p /tmp/artifact_restore
          if gh run list --workflow=daily_reel.yml --status=success --limit 1 --json databaseId -q '.[0].databaseId' > /tmp/latest_run_id.txt 2>/dev/null; then
            LATEST_RUN=$(cat /tmp/latest_run_id.txt)
            if [ -n "$LATEST_RUN" ] && [ "$LATEST_RUN" != "null" ]; then
              echo "Downloading previous artifact from run $LATEST_RUN..."
              if gh run download "$LATEST_RUN" --pattern "daily-reel-output-*" --dir /tmp/artifact_restore 2>/dev/null; then
                python -m app.storage.state_manager restore --source /tmp/artifact_restore
              fi
            fi
          fi
          rm -rf /tmp/artifact_restore /tmp/latest_run_id.txt

      - name: Validate & Synchronize State Integrity
        run: |
          python -m app.storage.state_manager validate
          python -m app.storage.state_manager audit

      - name: Validate Environment & Preflight
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INSTAGRAM_UPLOAD_METHOD: ${{ secrets.INSTAGRAM_UPLOAD_METHOD }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USERNAME: ${{ secrets.INSTAGRAM_USERNAME }}
          INSTAGRAM_PASSWORD: ${{ secrets.INSTAGRAM_PASSWORD }}
          INSTAGRAM_SESSION_ID: ${{ secrets.INSTAGRAM_SESSION_ID }}
          INSTAGRAM_SESSION_DATA: ${{ secrets.INSTAGRAM_SESSION_DATA }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
        run: |
          python app/autonomous/daily_algorithm_publisher.py --validate --dry-run

      - name: Run Daily Algorithm Publisher
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INSTAGRAM_UPLOAD_METHOD: ${{ secrets.INSTAGRAM_UPLOAD_METHOD }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USERNAME: ${{ secrets.INSTAGRAM_USERNAME }}
          INSTAGRAM_PASSWORD: ${{ secrets.INSTAGRAM_PASSWORD }}
          INSTAGRAM_SESSION_ID: ${{ secrets.INSTAGRAM_SESSION_ID }}
          INSTAGRAM_SESSION_DATA: ${{ secrets.INSTAGRAM_SESSION_DATA }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
          SARVAM_SPEAKER: "arjun"
          SARVAM_MODEL: "bulbul:v4-flash"
          SARVAM_PACE: "1.20"
          VOICE_ENGINE: "sarvam"
          VOICE_MODE: "smart"
          VOICE_GENDER: "male"
          BRAND_WATERMARK: "@neodivinestore.in"
          TIMEZONE: "Asia/Kolkata"
          CI: "true"
          GITHUB_ACTIONS: "true"
        run: |
          EXTRA_ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.force }}" = "true" ]; then
              EXTRA_ARGS="--force"
              echo "⚡ Forced run requested by operator."
            fi
            if [ -n "${{ inputs.category }}" ]; then
              EXTRA_ARGS="$EXTRA_ARGS --category ${{ inputs.category }}"
              echo "🎯 Specific category requested: ${{ inputs.category }}"
            fi
            if [ "${{ inputs.publish }}" != "true" ]; then
              EXTRA_ARGS="$EXTRA_ARGS --dry-run"
              echo "🛡️ Dry-run mode enabled (publishing to Instagram is safely BLOCKED)."
            else
              echo "🚀 Live publishing mode explicitly requested by operator."
            fi
          else
            # Default fallback: safe dry-run, never post automatically
            EXTRA_ARGS="--dry-run"
            echo "🛡️ Non-manual trigger: safe dry-run enforced."
          fi
          python app/autonomous/daily_algorithm_publisher.py $EXTRA_ARGS

      - name: Create Safe State Backup Snapshot
        if: always()
        run: |
          python -m app.storage.state_manager backup

      - name: Save Persistent State Cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            storage/
          key: insta-agent-state-${{ github.run_id }}

      - name: Save Generated Reel Package and Runtime State as Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-reel-output-${{ github.run_id }}
          path: |
            insta content/
            storage/
            output/reels/
          if-no-files-found: ignore
          retention-days: 30
