name: Daily Autonomous Instagram Reel Publisher

on:
  schedule:
    # 13:15 UTC = 18:45 IST (Peak Instagram Algorithm Evening Velocity)
    - cron: '15 13 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force publish today (bypasses daily frequency limiter)'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Verify FFmpeg
        run: |
          if ! command -v ffmpeg &> /dev/null; then
            echo "Installing ffmpeg..."
            sudo apt-get update -o Acquire::http::Timeout="10" -o Acquire::Retries="2" || true
            sudo apt-get install -y --no-install-recommends -o Acquire::http::Timeout="10" ffmpeg || true
          else
            echo "FFmpeg is already pre-installed on runner:"
            ffmpeg -version | head -n 1
          fi

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install moviepy==2.1.2 --no-deps

      - name: Run Daily Algorithm Publisher
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INSTAGRAM_USERNAME: ${{ secrets.INSTAGRAM_USERNAME }}
          INSTAGRAM_PASSWORD: ${{ secrets.INSTAGRAM_PASSWORD }}
          INSTAGRAM_SESSION_ID: ${{ secrets.INSTAGRAM_SESSION_ID }}
          INSTAGRAM_SESSION_DATA: ${{ secrets.INSTAGRAM_SESSION_DATA }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          VOICE_ENGINE: "elevenlabs"
          VOICE_MODE: "smart"
          VOICE_GENDER: "male"
          BRAND_WATERMARK: "@neodivinestore.in"
          TIMEZONE: "Asia/Kolkata"
        run: |
          python app/autonomous/daily_algorithm_publisher.py --force

      - name: Save Generated Reel Package as Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-reel-output-${{ github.run_id }}
          path: |
            insta content/
            storage/
          if-no-files-found: ignore
          retention-days: 7
