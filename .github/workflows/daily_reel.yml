name: Daily Autonomous Instagram Reel Publisher

on:
  schedule:
    # 03:15 UTC = 08:45 IST (Morning Devotion & Prime Window - avoided top-of-hour congestion)
    - cron: '15 3 * * *'
    # 05:15 UTC = 10:45 IST (Mid-Morning Catch-up window)
    - cron: '15 5 * * *'
    # 07:15 UTC = 12:45 IST (Lunch Break Peak Window)
    - cron: '15 7 * * *'
    # 13:15 UTC = 18:45 IST (Prime Evening Golden Surge)
    - cron: '15 13 * * *'
    # 16:15 UTC = 21:45 IST (Late Night Relax Window)
    - cron: '15 16 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force publish today (bypasses daily frequency limiter & timing gate)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      category:
        description: 'Optional content category override (e.g. healing_crystals, sacred_rudraksha)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Verify FFmpeg and Fonts
        run: |
          sudo apt-get update -o Acquire::http::Timeout="10" -o Acquire::Retries="2" || true
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-core fonts-deva fonts-noto-extra || true
          ffmpeg -version | head -n 1

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Run Daily Algorithm Publisher
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INSTAGRAM_USERNAME: ${{ secrets.INSTAGRAM_USERNAME }}
          INSTAGRAM_PASSWORD: ${{ secrets.INSTAGRAM_PASSWORD }}
          INSTAGRAM_SESSION_ID: ${{ secrets.INSTAGRAM_SESSION_ID }}
          INSTAGRAM_SESSION_DATA: ${{ secrets.INSTAGRAM_SESSION_DATA }}
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
          SARVAM_SPEAKER: "arjun"
          SARVAM_MODEL: "bulbul:v4-flash"
          SARVAM_PACE: "1.20"
          VOICE_ENGINE: "sarvam"
          VOICE_MODE: "smart"
          VOICE_GENDER: "male"
          BRAND_WATERMARK: "@neodivinestore.in"
          TIMEZONE: "Asia/Kolkata"
          CI: "true"
          GITHUB_ACTIONS: "true"
        run: |
          EXTRA_ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.force }}" = "true" ]; then
              EXTRA_ARGS="--force"
              echo "⚡ Manual forced publication requested by operator."
            fi
            if [ -n "${{ inputs.category }}" ]; then
              EXTRA_ARGS="$EXTRA_ARGS --category ${{ inputs.category }}"
              echo "🎯 Specific category requested: ${{ inputs.category }}"
            fi
          else
            echo "🤖 Scheduled algorithmic trigger: evaluating daily limit and generating today's reel."
          fi
          python app/autonomous/daily_algorithm_publisher.py $EXTRA_ARGS

      - name: Commit Tracking History & State
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f storage/daily_post_tracker.json storage/trend_history.json storage/algorithm_intelligence.json 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "chore(autonomous): sync post tracker & trend history [skip ci]" || echo "No changes to commit"
            git pull --rebase origin main || true
            git push origin main || echo "Push skipped or not needed"
          else
            echo "No tracking changes to commit."
          fi

      - name: Save Generated Reel Package as Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-reel-output-${{ github.run_id }}
          path: |
            insta content/
            storage/
          if-no-files-found: ignore
          retention-days: 7
