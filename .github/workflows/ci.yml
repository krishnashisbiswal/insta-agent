name: CI Test Suite and Integrity Verification

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Fonts & FFmpeg
        run: |
          sudo apt-get update -o Acquire::http::Timeout="10" -o Acquire::Retries="2" || true
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-core fonts-deva || true

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suite
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AUTO_PUBLISH: "false"
          PYTHONPATH: "."
        run: |
          pytest -v
