[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "insta-agent"
version = "2.0.0"
description = "Autonomous Instagram Reel Generation and Publishing System"
readme = "README.md"
requires-python = ">=3.11, <3.14"
license = {text = "Proprietary"}
authors = [
    {name = "Krishna", email = "krishnashis1424@gmail.com"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "google-genai>=2.0.0",
    "moviepy>=2.1.2,<2.3.0",
    "Pillow>=9.2.0",
    "imagehash>=4.3.1",
    "imageio>=2.34.0",
    "imageio-ffmpeg>=0.4.9",
    "decorator>=5.1.1",
    "proglog>=0.1.10",
    "numpy>=1.26.0",
    "edge-tts>=7.3.1",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "urllib3>=2.0.0",
    "instagrapi>=2.1.3",
    "filelock>=3.13.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.7.0",
    "email-validator>=2.0.0",
    "cryptography>=42.0.0",
    "pyjwt>=2.8.0",
    "bcrypt>=4.1.0",
    "tzdata>=2024.1",
    "sqlalchemy>=2.0.25",
    "alembic>=1.13.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "aiofiles>=24.0.0",
    "tqdm>=4.66.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
