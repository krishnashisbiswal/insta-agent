name: Daily Autonomous Instagram Reel Publisher

on:
  schedule:
    # 13:15 UTC = 18:45 IST (Peak Instagram Algorithm Evening Velocity)
    - cron: '15 13 * * *'
  workflow_dispatch: # Allows manual 1-click execution anytime from GitHub website

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install FFmpeg & System Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu fonts-freefont-ttf

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Daily Algorithm Publisher
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INSTAGRAM_USERNAME: ${{ secrets.INSTAGRAM_USERNAME }}
          INSTAGRAM_PASSWORD: ${{ secrets.INSTAGRAM_PASSWORD }}
          VOICE_ENGINE: "edge_neural"
          VOICE_MODE: "smart"
          VOICE_GENDER: "male"
          BRAND_WATERMARK: "@neodivinestore.in"
          TIMEZONE: "Asia/Kolkata"
        run: |
          python app/autonomous/daily_algorithm_publisher.py --force

      - name: Save Generated Reel Package as Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-reel-output-${{ github.run_id }}
          path: |
            insta content/
            storage/daily_post_tracker.json
            storage/trend_history.json
          retention-days: 7
